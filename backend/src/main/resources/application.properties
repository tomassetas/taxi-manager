spring.config.import=optional:file:../.env[.properties]
spring.application.name=taxi-manager

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:taxi_manager}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:taxi_manager}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/taxi-manager}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/taxi-manager/protocol/openid-connect/certs}


app.keycloak.admin.server-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:taxi-manager}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:taxi-manager-backend}
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}